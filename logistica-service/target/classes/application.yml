server:
  port: 8083

spring:
  application:
    name: logistica-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/logistica_db}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:donatrack}
    password: ${SPRING_RABBITMQ_PASSWORD:donatrack_password}

donatrack:
  rabbitmq:
    exchange: "donatrack.events.exchange"
    routing-key:
      ruta-iniciada: "ruta.iniciada"
      entrega-confirmada: "entrega.confirmada"
      entrega-fallida: "entrega.fallida"

  servicios:
    donaciones-url: ${DONACIONES_SERVICE_URL:http://localhost:8082}

  vrp:
    url: ${DONATRACK_VRP_URL:http://localhost:5000}
    http-enabled: ${DONATRACK_VRP_HTTP_ENABLED:false}

  rutas:
    max-lote-donaciones: 100

  cron:
    # Modo demo / pruebas operativas: ejecuta planificación de rutas cada 5 minutos (en producción: "0 0 1 * * ?")
    planificacion-rutas: ${DONATRACK_CRON_RUTAS:0 */5 * * * *}
