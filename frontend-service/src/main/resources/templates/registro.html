<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Crear cuenta — DonaTrack</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-2">
        <div class="col-md-9 col-lg-7">
            <div class="card p-4 p-md-5">
                <div class="mb-4">
                    <h1 class="h4 fw-bold mb-1">Crear una cuenta</h1>
                    <p class="text-secondary small mb-0">Selecciona el tipo de perfil para registrarte en la plataforma.</p>
                </div>

                <div th:if="${mensajeError}" class="alert alert-danger py-2 small mb-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1" aria-hidden="true"></i>
                    <span th:text="${mensajeError}">Error al registrar</span>
                </div>
                <div th:if="${mensajeExito}" class="alert alert-success py-2 small mb-3" role="alert">
                    <i class="fa-solid fa-circle-check me-1" aria-hidden="true"></i>
                    <span th:text="${mensajeExito}">Mensaje exitoso</span>
                </div>

                <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3 border" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-2 small fw-medium py-2" id="tab-donante" data-bs-toggle="pill" data-bs-target="#content-donante" type="button">
                            Donante particular
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-2 small fw-medium py-2" id="tab-juridica" data-bs-toggle="pill" data-bs-target="#content-juridica" type="button">
                            Empresa / Institución
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-2 small fw-medium py-2" id="tab-entidad" data-bs-toggle="pill" data-bs-target="#content-entidad" type="button">
                            Entidad beneficiaria
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    <!-- Registro Donante Particular -->
                    <div class="tab-pane fade show active" id="content-donante">
                        <form action="/registro/donante" method="post" id="formDonante">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre <span class="text-danger">*</span></label>
                                    <input type="text" name="nombre" class="form-control" placeholder="Juan" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Apellido <span class="text-danger">*</span></label>
                                    <input type="text" name="apellido" class="form-control" placeholder="Pérez" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">DNI / Documento <span class="text-danger">*</span></label>
                                    <input type="text" name="dni" class="form-control" placeholder="35123456" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Edad</label>
                                    <input type="number" name="edad" class="form-control" placeholder="30" min="18" max="110">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo electrónico <span class="text-danger">*</span></label>
                                    <input type="email" name="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" name="password" class="form-control" placeholder="Mínimo 4 caracteres" required minlength="4">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono / WhatsApp</label>
                                    <input type="text" name="telefono" class="form-control" placeholder="+54 9 11 1234-5678">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Dirección (Calle y altura)</label>
                                    <div class="input-group">
                                        <input type="text" id="dirDonante" name="direccion" class="form-control" placeholder="Av. Medrano 951, CABA"
                                               oninput="onInputDireccionDebounced('dirDonante', 'feedbackDonante')"
                                               onblur="validarDireccionFrontend('dirDonante', 'feedbackDonante')">
                                        <button class="btn btn-outline-secondary" type="button" onclick="validarDireccionFrontend('dirDonante', 'feedbackDonante')" title="Verificar domicilio">
                                            Verificar
                                        </button>
                                    </div>
                                    <div id="feedbackDonante" class="mt-1"></div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-dt-primary w-100 py-2">
                                        Registrarme como donante
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Registro Empresa / Donante Jurídica -->
                    <div class="tab-pane fade" id="content-juridica">
                        <form action="/registro/juridica" method="post" id="formJuridica">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Razón social <span class="text-danger">*</span></label>
                                    <input type="text" name="razonSocial" class="form-control" placeholder="Alimentos del Sur S.A." required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">CUIT <span class="text-danger">*</span></label>
                                    <input type="text" name="cuit" class="form-control" placeholder="30-11223344-9" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tipo de organización</label>
                                    <select name="tipo" class="form-select">
                                        <option value="Empresa" selected>Empresa comercial</option>
                                        <option value="ONG">Organización sin fines de lucro (ONG)</option>
                                        <option value="Institucion">Institución educativa / civil</option>
                                        <option value="Gubernamental">Organismo público</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Rubro principal</label>
                                    <input type="text" name="rubro" class="form-control" placeholder="Alimentos, logística, salud...">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo institucional <span class="text-danger">*</span></label>
                                    <input type="email" name="email" class="form-control" placeholder="contacto@empresa.com.ar" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" name="password" class="form-control" placeholder="Mínimo 4 caracteres" required minlength="4">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono de contacto</label>
                                    <input type="text" name="telefono" class="form-control" placeholder="+54 11 4000-0000">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Representante</label>
                                    <input type="text" name="representante" class="form-control" placeholder="Nombre y cargo">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Dirección de planta o depósito</label>
                                    <div class="input-group">
                                        <input type="text" id="dirJuridica" name="direccion" class="form-control" placeholder="Bouchard 680, CABA"
                                               oninput="onInputDireccionDebounced('dirJuridica', 'feedbackJuridica')"
                                               onblur="validarDireccionFrontend('dirJuridica', 'feedbackJuridica')">
                                        <button class="btn btn-outline-secondary" type="button" onclick="validarDireccionFrontend('dirJuridica', 'feedbackJuridica')">
                                            Verificar
                                        </button>
                                    </div>
                                    <div id="feedbackJuridica" class="mt-1"></div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-dt-primary w-100 py-2">
                                        Registrar organización donante
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Registro Entidad -->
                    <div class="tab-pane fade" id="content-entidad">
                        <form action="/registro/entidad" method="post" id="formEntidad">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Nombre de la entidad beneficiaria <span class="text-danger">*</span></label>
                                    <input type="text" name="razonSocial" class="form-control" placeholder="Comedor Comunitario Esperanza" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Dirección de sede (recepción de entregas) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="text" id="dirEntidad" name="direccion" class="form-control" placeholder="Av. Corrientes 4500, CABA" required
                                               oninput="onInputDireccionDebounced('dirEntidad', 'feedbackEntidad')"
                                               onblur="validarDireccionFrontend('dirEntidad', 'feedbackEntidad')">
                                        <button class="btn btn-outline-secondary" type="button" onclick="validarDireccionFrontend('dirEntidad', 'feedbackEntidad')">
                                            Verificar
                                        </button>
                                    </div>
                                    <div id="feedbackEntidad" class="mt-1"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono de la sede <span class="text-danger">*</span></label>
                                    <input type="text" name="telefono" class="form-control" placeholder="11-4444-5555" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo electrónico del responsable <span class="text-danger">*</span></label>
                                    <input type="email" name="email" class="form-control" placeholder="responsable@entidad.org" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" name="password" class="form-control" placeholder="Mínimo 4 caracteres" required minlength="4">
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-dt-primary w-100 py-2">
                                        Registrar entidad beneficiaria
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">¿Ya tienes una cuenta? <a href="/login" class="fw-medium text-decoration-none" style="color: var(--color-primary);">Iniciar sesión</a></span>
                </div>
            </div>
        </div>
    </div>

    <style>
        #pills-tab .nav-link {
            color: var(--color-text-secondary);
        }
        #pills-tab .nav-link.active {
            background-color: var(--color-surface);
            color: var(--color-text);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        }
    </style>

    <script>
    let debounceTimers = {};

    function onInputDireccionDebounced(inputId, feedbackId) {
        if (debounceTimers[inputId]) {
            clearTimeout(debounceTimers[inputId]);
        }
        const input = document.getElementById(inputId);
        const feedback = document.getElementById(feedbackId);
        if (!input || !input.value.trim()) {
            if (feedback) feedback.innerHTML = '';
            if (input) input.classList.remove('is-valid', 'is-invalid');
            return;
        }
        debounceTimers[inputId] = setTimeout(() => {
            validarDireccionFrontend(inputId, feedbackId);
        }, 600);
    }

    async function validarDireccionFrontend(inputId, feedbackId) {
        const input = document.getElementById(inputId);
        const feedback = document.getElementById(feedbackId);
        if (!input || !feedback) return;

        const dir = input.value.trim();
        if (!dir) {
            feedback.innerHTML = '';
            input.classList.remove('is-valid', 'is-invalid');
            return;
        }

        feedback.innerHTML = '<span class="text-muted small">Verificando dirección...</span>';

        try {
            const resp = await fetch('/api/direcciones/validar?direccion=' + encodeURIComponent(dir));
            if (!resp.ok) {
                feedback.innerHTML = '<span class="text-muted small">No se pudo verificar la dirección en este momento.</span>';
                return;
            }
            const data = await resp.json();

            if (data.esValida) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                if (data.nomenclatura) {
                    input.value = data.nomenclatura;
                }
                feedback.innerHTML = `<div class="small text-success mt-1"><i class="fa-solid fa-check me-1"></i>Dirección verificada: ${data.nomenclatura || dir}</div>`;
            } else {
                input.classList.remove('is-valid');
                input.classList.add('is-invalid');
                feedback.innerHTML = `<div class="small text-danger mt-1"><i class="fa-solid fa-circle-exclamation me-1"></i>${data.mensajeValidacion || 'Indique calle y altura válidas.'}</div>`;
            }
        } catch (err) {
            feedback.innerHTML = '';
        }
    }
    </script>
</div>
</body>
</html>
