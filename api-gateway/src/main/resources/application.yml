server:
  port: 8080

spring:
  application:
    name: api-gateway

  codec:
    max-in-memory-size: 30MB

  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        # Rutas hacia el Servicio de Donaciones
        - id: donaciones-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/donaciones/**

        - id: donantes-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/donantes/**, /api/v1/personas-donantes/**

        - id: entidades-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/entidades/**

        - id: necesidades-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/necesidades/**

        - id: matchmaking-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/matchmaking/**

        - id: direcciones-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/direcciones/**

        - id: graphql-service
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/graphql/**, /graphiql/**

        # Rutas hacia el Servicio de Logistica
        - id: logistica-service
          uri: ${LOGISTICA_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/logistica/**

        - id: camiones-service
          uri: ${LOGISTICA_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/camiones/**

        - id: pendientes-lote-service
          uri: ${LOGISTICA_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/pendientes-lote/**

        # Rutas hacia el Servicio de Incentivos
        - id: incentivos-service
          uri: ${INCENTIVOS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/incentivos/**

        # Rutas hacia el Servicio de Notificaciones
        - id: notificaciones-service
          uri: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notificaciones/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

donatrack:
  gateway:
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      capacity: ${GATEWAY_RATE_LIMIT_CAPACITY:120}
    security:
      enabled: ${GATEWAY_SECURITY_ENABLED:true}
      enforce-strict-jwt: ${GATEWAY_ENFORCE_STRICT_JWT:false}
      jwt-secret: ${GATEWAY_JWT_SECRET:donatrack-default-super-secret-key-32-chars!}
      verify-signature: ${GATEWAY_VERIFY_SIGNATURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] %logger{36} - %msg%n"
