<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Registrar Donación en Depósito - DonaTrack</title>
</head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1>Registrar Donación en Depósito</h1>
            <p class="page-subtitle">Recepción de bienes en almacén y desglose por subcategoría para posterior asignación.</p>
        </div>
        <div>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i>Volver al panel
            </a>
        </div>
    </div>

    <!-- Alertas Flash -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${mensajeExito}">Éxito</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${mensajeError}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="fw-bold mb-0 text-dark">Ingreso de bienes recibidos</h6>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#collapseNuevoDonante">
                        <i class="fa-solid fa-user-plus me-1"></i>Registrar nuevo donante
                    </button>
                </div>

                <!-- Sección colapsable para dar de alta un nuevo donante desde Depósito -->
                <div class="collapse border-bottom bg-light p-4" id="collapseNuevoDonante">
                    <h6 class="fw-bold text-dark mb-3">Alta rápida de donante</h6>
                    <form action="/admin/donantes/registrar" method="post" class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label small">Tipo de donante</label>
                            <select name="tipoDonante" class="form-select form-select-sm" onchange="alternarCamposDonanteAdmin(this.value)">
                                <option value="HUMANA" selected>Persona Humana</option>
                                <option value="JURIDICA">Organización / Empresa</option>
                            </select>
                        </div>
                        <div class="col-md-4 campo-humana">
                            <label class="form-label small">Nombre</label>
                            <input type="text" name="nombre" class="form-control form-control-sm" placeholder="Ej. Laura">
                        </div>
                        <div class="col-md-4 campo-humana">
                            <label class="form-label small">Apellido</label>
                            <input type="text" name="apellido" class="form-control form-control-sm" placeholder="Ej. Martínez">
                        </div>
                        <div class="col-md-4 campo-humana">
                            <label class="form-label small">DNI</label>
                            <input type="text" name="dni" class="form-control form-control-sm" placeholder="Ej. 38112233">
                        </div>
                        <div class="col-md-4 campo-juridica d-none">
                            <label class="form-label small">Razón Social</label>
                            <input type="text" name="razonSocial" class="form-control form-control-sm" placeholder="Ej. Alimentos del Sur S.A.">
                        </div>
                        <div class="col-md-4 campo-juridica d-none">
                            <label class="form-label small">CUIT</label>
                            <input type="text" name="cuit" class="form-control form-control-sm" placeholder="Ej. 30-12345678-9">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Correo electrónico <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control form-control-sm" placeholder="contacto@ejemplo.com" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Teléfono</label>
                            <input type="text" name="telefono" class="form-control form-control-sm" placeholder="+54 11 4444-5555">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small">Dirección</label>
                            <input type="text" name="direccion" class="form-control form-control-sm" placeholder="Av. Medrano 951, CABA">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-sm btn-dt-primary w-100">
                                Guardar donante
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/admin/donaciones/nueva}" method="post">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Donante de origen <span class="text-danger">*</span></label>
                                <select name="donanteId" class="form-select" required>
                                    <option value="" disabled selected>Seleccione un donante registrado...</option>
                                    <option th:each="d : ${donantes}" 
                                            th:value="${d.id}" 
                                            th:text="${(d['nombreCompleto'] != null ? d['nombreCompleto'] : (d['razonSocial'] != null ? d['razonSocial'] : 'Donante #' + d['id'])) + ' (' + (d['emailPrincipal'] != null ? d['emailPrincipal'] : 'sin email') + ')'}">
                                        Juan Pérez (juan@example.com)
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nota de remito o lote <small class="text-muted fw-normal">(opcional)</small></label>
                                <input type="text" name="descripcionGeneral" class="form-control" placeholder="Ej. Recepción en depósito central">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 pt-2 border-top">
                            <h6 class="fw-bold text-dark mb-0">Ítems recibidos</h6>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="agregarOtroBienCarga()">
                                <i class="fa-solid fa-plus me-1"></i>Agregar otro ítem
                            </button>
                        </div>

                        <div id="contenedorBienesCarga">
                            <div class="item-bien-carga border rounded-3 p-3 bg-light mb-3">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Descripción del bien <span class="text-danger">*</span></label>
                                        <input type="text" name="nombreBien" class="form-control" placeholder="Ej. Leche larga vida, fideos secos, calzado" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Categoría <span class="text-danger">*</span></label>
                                        <select name="categoria" class="form-select" required>
                                            <option value="Alimentos" selected>Alimentos</option>
                                            <option value="Vestimenta">Vestimenta</option>
                                            <option value="Mobiliario">Mobiliario</option>
                                            <option value="Salud e Higiene">Salud e Higiene</option>
                                            <option value="Útiles Escolares">Útiles Escolares</option>
                                            <option value="Bienes Generales">Bienes Generales</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Condición</label>
                                        <select name="esUsado" class="form-select">
                                            <option value="false" selected>Nuevo / Sin uso</option>
                                            <option value="true">Usado en buen estado</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Subcategoría <span class="text-danger">*</span></label>
                                        <input type="text" name="subcategoria" class="form-control" list="subcategoriasAdminList"
                                               placeholder="Ej. fideos, arroz, leche, frazadas..." required autocomplete="off">
                                        <datalist id="subcategoriasAdminList">
                                            <option value="fideos">fideos</option>
                                            <option value="arroz">arroz</option>
                                            <option value="leche">leche</option>
                                            <option value="harina">harina</option>
                                            <option value="aceite">aceite</option>
                                            <option value="azucar">azucar</option>
                                            <option value="lentejas">lentejas</option>
                                            <option value="polenta">polenta</option>
                                            <option value="frazadas">frazadas</option>
                                            <option value="camperas">camperas</option>
                                            <option value="calzado">calzado</option>
                                            <option value="pañales">pañales</option>
                                            <option value="articulos_higiene">articulos_higiene</option>
                                            <option value="limpieza">limpieza</option>
                                            <option value="utiles_escolares">utiles_escolares</option>
                                            <option value="mobiliario">mobiliario</option>
                                            <option value="ALIMENTOS_NO_PERECEDEROS">ALIMENTOS_NO_PERECEDEROS</option>
                                            <option value="LACTEOS">LACTEOS</option>
                                            <option value="FRESCOS">FRESCOS</option>
                                            <option value="ROPA_ABRIGO">ROPA_ABRIGO</option>
                                        </datalist>
                                    </div>

                                    <div class="col-md-2">
                                        <label class="form-label">Cantidad <span class="text-danger">*</span></label>
                                        <input type="number" step="0.1" min="0.1" name="cantidad" class="form-control" placeholder="50" required>
                                    </div>

                                    <div class="col-md-2">
                                        <label class="form-label">Unidad <span class="text-danger">*</span></label>
                                        <select name="unidadMedida" class="form-select" required>
                                            <option value="UNIDADES">Unidades</option>
                                            <option value="KG">Kilogramos (kg)</option>
                                            <option value="LITROS">Litros (L)</option>
                                            <option value="CAJAS">Cajas</option>
                                            <option value="BULTOS">Bultos</option>
                                        </select>
                                    </div>

                                    <div class="col-md-2">
                                        <label class="form-label">Vencimiento</label>
                                        <input type="date" name="fechaVencimiento" class="form-control">
                                    </div>

                                    <div class="col-md-2">
                                        <label class="form-label">Foto URL <small class="text-muted">(opc.)</small></label>
                                        <input type="url" name="fotoUrl" class="form-control" placeholder="https://...">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dt-primary px-4">
                                Registrar en depósito
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function alternarCamposDonanteAdmin(tipo) {
            document.querySelectorAll('.campo-humana').forEach(function(el) {
                el.classList.toggle('d-none', tipo === 'JURIDICA');
            });
            document.querySelectorAll('.campo-juridica').forEach(function(el) {
                el.classList.toggle('d-none', tipo !== 'JURIDICA');
            });
        }

        function agregarOtroBienCarga() {
            var contenedor = document.getElementById('contenedorBienesCarga');
            var original = contenedor.querySelector('.item-bien-carga');
            if (!original) return;
            var clon = original.cloneNode(true);
            clon.querySelectorAll('input').forEach(function(inp) {
                if (inp.type === 'checkbox') inp.checked = false;
                else inp.value = '';
            });
            contenedor.appendChild(clon);
        }
    </script>
</div>
</body>
</html>
