<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Registrar Necesidades Materiales - DonaTrack</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-0"><i class="fa-solid fa-clipboard-list text-primary me-2"></i>Registrar Necesidad Material Concreta</h2>
            <p class="text-secondary">Indica los recursos que tu entidad requiere para ser priorizada en el algoritmo de Matchmaking.</p>
        </div>
        <a href="/beneficiaria" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i>Volver al Panel</a>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
        <i class="fa-solid fa-check-circle me-2"></i><span th:text="${mensajeExito}">Éxito</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <form action="/beneficiaria/necesidades" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Entidad Beneficiaria</label>
                        <select name="entidadId" class="form-select" required>
                            <option th:each="ent : ${entidades}" th:value="${ent.id}" th:selected="${ent.id == entidadId}" th:text="${ent.razonSocial}">Comedor Los Chicos</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Subcategoría (Unidad Mínima)</label>
                            <input type="text" name="subcategoria" class="form-control" placeholder="Ej. arroz, fideos, leche, frazadas" required>
                            <small class="text-muted">Debe coincidir semánticamente con las donaciones.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tipo de Necesidad</label>
                            <select name="tipo" class="form-select" required>
                                <option value="EXTRAORDINARIA">Extraordinaria (Alta Urgencia / Emergencia)</option>
                                <option value="RECURRENTE">Recurrente (Periódica)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Cantidad Solicitada</label>
                            <input type="number" step="0.1" name="cantidadSolicitada" class="form-control" placeholder="50.0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Unidad de Medida</label>
                            <select name="unidadMedida" class="form-select" required>
                                <option value="kg">Kilogramos (kg)</option>
                                <option value="litros">Litros</option>
                                <option value="unidades">Unidades</option>
                                <option value="paquetes">Paquetes</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Periodicidad (Solo si es Recurrente)</label>
                        <input type="text" name="periodo" class="form-control" placeholder="Ej. SEMANAL, MENSUAL">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Descripción Detallada</label>
                        <textarea name="descripcion" class="form-control" rows="3" placeholder="Detalle el destino o motivo del recurso solicitado..." required></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dt-primary py-2 fw-semibold">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i>Registrar Necesidad en DonaTrack
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
