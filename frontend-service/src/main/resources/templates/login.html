<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Iniciar sesión — DonaTrack</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4">
                <div class="mb-4">
                    <h1 class="h4 fw-bold mb-1">Iniciar sesión</h1>
                    <p class="text-secondary small mb-0">Ingresa a tu cuenta de donante, entidad o administración.</p>
                </div>

                <div th:if="${errorMensaje}" class="alert alert-danger py-2 small mb-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1" aria-hidden="true"></i>
                    <span th:text="${errorMensaje}">Error al autenticar</span>
                </div>
                <div th:if="${mensajeExito}" class="alert alert-success py-2 small mb-3" role="alert">
                    <i class="fa-solid fa-circle-check me-1" aria-hidden="true"></i>
                    <span th:text="${mensajeExito}">Mensaje exitoso</span>
                </div>
                <div th:if="${mensajeInfo}" class="alert alert-info py-2 small mb-3" role="alert">
                    <i class="fa-solid fa-circle-info me-1" aria-hidden="true"></i>
                    <span th:text="${mensajeInfo}">Información</span>
                </div>

                <form action="/login" method="post">
                    <input type="hidden" name="redirect" th:value="${redirect}">

                    <div class="mb-3">
                        <label for="loginUsername" class="form-label">Usuario o correo electrónico</label>
                        <input type="text" id="loginUsername" name="username" class="form-control" placeholder="nombre@ejemplo.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dt-primary py-2">
                            Continuar
                        </button>
                    </div>

                    <div class="text-center border-top pt-3">
                        <span class="text-muted small">¿No tienes una cuenta? <a href="/registro" class="fw-medium text-decoration-none" style="color: var(--color-primary);">Crear cuenta</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
