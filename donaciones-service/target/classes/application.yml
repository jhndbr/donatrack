server:
  port: 8082

spring:
  application:
    name: donaciones-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

  jackson:
    serialization:
      fail-on-empty-beans: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:donatrack}
    password: ${SPRING_DATASOURCE_PASSWORD:donatrack_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
        # Optimizaciones criticas para importacion masiva de CSV (>20.000 filas)
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:donatrack}
    password: ${SPRING_RABBITMQ_PASSWORD:donatrack_password}

  graphql:
    graphiql:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Configuracion de Colas y Exchanges de Donaciones
donatrack:
  rabbitmq:
    exchange: "donatrack.events.exchange"
    queue:
      donacion-asignada: "q.notificaciones.donacion-asignada"
      donante-inactivo: "q.notificaciones.donante-inactivo"
      donacion-registrada: "q.notificaciones.donacion-registrada"
      donante-registrado: "q.notificaciones.donante-registrado"
    routing-key:
      donacion-asignada: "donacion.asignada"
      donante-inactivo: "donante.inactivo"
      donacion-registrada: "donacion.registrada"
      donante-registrado: "donante.registrado"
  scheduler:
    matchmaking:
      initial-delay: 10000
      fixed-delay: 300000
      auto-assign: false
  georef:
    url: ${DONATRACK_GEOREF_URL:https://apis.datos.gob.ar/georef/api/direcciones}
    timeout-ms: 4000
    strict: false
