<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Iniciar Sesión - DonaTrack</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary p-3 d-inline-flex mb-2">
                        <i class="fa-solid fa-lock fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
                    <p class="text-muted small">Ingresa tus credenciales para acceder a tu portal</p>
                </div>

                <!-- Alertas de error / estado -->
                <div th:if="${errorMensaje}" class="alert alert-danger py-2 small rounded-3 mb-3" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i>
                    <span th:text="${errorMensaje}">Error al autenticar</span>
                </div>
                <div th:if="${mensajeExito}" class="alert alert-success py-2 small rounded-3 mb-3" role="alert">
                    <i class="fa-solid fa-circle-check me-1"></i>
                    <span th:text="${mensajeExito}">Mensaje exitoso</span>
                </div>
                <div th:if="${mensajeInfo}" class="alert alert-info py-2 small rounded-3 mb-3" role="alert">
                    <i class="fa-solid fa-info-circle me-1"></i>
                    <span th:text="${mensajeInfo}">Información</span>
                </div>

                <!-- Formulario Oficial de Autenticación -->
                <form action="/login" method="post">
                    <input type="hidden" name="redirect" th:value="${redirect}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Usuario o Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" id="loginUsername" name="username" class="form-control border-start-0" placeholder="admin o juan.donante@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" id="loginPassword" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dt-primary py-2 fw-semibold">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Entrar al Sistema
                        </button>
                    </div>

                    <div class="text-center">
                        <span class="text-muted small">¿No tienes cuenta? <a href="/registro" class="fw-semibold text-primary">Regístrate gratis</a></span>
                    </div>
                </form>

                <!-- Tarjeta Colapsable de Guía de Acceso Rápido con Auto-Completado -->
                <div class="mt-4 pt-3 border-top">
                    <a class="small text-muted text-decoration-none d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#credencialesDemo" role="button">
                        <span><i class="fa-solid fa-wand-magic-sparkles me-1 text-primary"></i> Acceso Rápido con Cuentas Demo</span>
                        <i class="fa-solid fa-chevron-down small"></i>
                    </a>
                    <div class="collapse mt-2 show" id="credencialesDemo">
                        <div class="p-2 bg-light rounded-3 small border">
                            <div class="d-flex flex-column gap-1">
                                <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center py-1 px-2"
                                        onclick="usarCredencialDemo('juan.donante@example.com', 'donante123')">
                                    <span><i class="fa-solid fa-user-heart me-1"></i> Donante Particular</span>
                                    <code class="small text-muted">juan.donante@example.com</code>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-info text-start d-flex justify-content-between align-items-center py-1 px-2"
                                        onclick="usarCredencialDemo('rse@molinos.com.ar', 'empresa123')">
                                    <span><i class="fa-solid fa-building me-1"></i> Empresa Donante</span>
                                    <code class="small text-muted">rse@molinos.com.ar</code>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center py-1 px-2"
                                        onclick="usarCredencialDemo('esperanza@comedor.org', 'comedor123')">
                                    <span><i class="fa-solid fa-hands-holding-child me-1"></i> Entidad / Comedor</span>
                                    <code class="small text-muted">esperanza@comedor.org</code>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-dark text-start d-flex justify-content-between align-items-center py-1 px-2"
                                        onclick="usarCredencialDemo('admin', 'admin123')">
                                    <span><i class="fa-solid fa-shield-halved me-1"></i> Administrador Central</span>
                                    <code class="small text-muted">admin</code>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center py-1 px-2"
                                        onclick="usarCredencialDemo('chofer', 'chofer123')">
                                    <span><i class="fa-solid fa-truck-fast me-1"></i> Chofer Logístico</span>
                                    <code class="small text-muted">chofer</code>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function usarCredencialDemo(usuario, pass) {
    const uInput = document.getElementById('loginUsername');
    const pInput = document.getElementById('loginPassword');
    if (uInput && pInput) {
        uInput.value = usuario;
        pInput.value = pass;
        uInput.classList.add('is-valid');
        pInput.classList.add('is-valid');
        setTimeout(() => {
            uInput.classList.remove('is-valid');
            pInput.classList.remove('is-valid');
        }, 1200);
    }
}
</script>
</body>
</html>
