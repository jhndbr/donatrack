server:
  port: 8086
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: frontend-service

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

donatrack:
  api-gateway:
    url: ${API_GATEWAY_URL:http://localhost:8080}
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:donatrack}
    client-id: ${KEYCLOAK_CLIENT_ID:donatrack-client}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [frontend-service] [%X{correlationId:-}] [%X{traceId:-}] %logger{36} - %msg%n"
