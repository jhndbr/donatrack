<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Entidades beneficiarias — DonaTrack</title>
</head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1>Entidades beneficiarias</h1>
            <p>Organizaciones sociales, comedores y centros de salud registrados en la red.</p>
        </div>
        <a href="/donante" class="btn btn-outline-secondary btn-sm">Volver</a>
    </div>

    <div class="row g-3">
        <div th:if="${#lists.isEmpty(entidades)}" class="col-12 text-muted small">
            No hay entidades registradas en este momento.
        </div>
        <div th:each="ent : ${entidades}" class="col-md-6 col-lg-4">
            <div class="card h-100 p-4 d-flex flex-column">
                <div class="mb-3">
                    <h2 class="h6 fw-semibold text-dark mb-1" th:text="${ent.razonSocial}">Comedor Los Chicos</h2>
                    <div class="small text-muted" th:text="${ent.direccion}">Av. Corrientes 1234</div>
                </div>
                <div class="small text-secondary mb-1">
                    <span class="text-muted">Teléfono:</span> <span th:text="${ent.telefono != null ? ent.telefono : '11-4444-5555'}">11-4444-5555</span>
                </div>
                <div class="small text-secondary mb-3">
                    <span class="text-muted">Contacto:</span> <span th:text="${ent.emailPrincipal != null ? ent.emailPrincipal : 'contacto@entidad.org'}">contacto@entidad.org</span>
                </div>
                <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                    <span class="small text-muted">
                        <strong class="text-dark" th:text="${ent.donacionesRecibidasTrimestre != null ? ent.donacionesRecibidasTrimestre : 0}">0</strong> entregas este trimestre
                    </span>
                    <span class="badge bg-light text-secondary border">Red activa</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
